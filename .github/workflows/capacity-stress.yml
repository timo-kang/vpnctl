name: M3 capacity stress

# Diagnostic profiles, separate from the one-CPU robot functional CI baseline.
# Failures remain failures; no continue-on-error or retries to erase evidence.
on:
  workflow_dispatch:
    inputs:
      robot_cpus:
        description: Robot CPU quota (not a hardware minimum)
        type: choice
        default: '0.5'
        options: ['0.5', '0.25']

permissions:
  contents: read

concurrency:
  group: capacity-stress-${{ github.ref }}-${{ inputs.robot_cpus }}
  cancel-in-progress: false

jobs:
  capacity-stress:
    name: M3 stress (${{ matrix.layout }}, ${{ matrix.profile }}, robot ${{ inputs.robot_cpus }} CPU)
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: '4', layout: shared, outer_cpus: '1'}
          - {profile: '8', layout: shared, outer_cpus: '1'}
          - {profile: '4', layout: split, outer_cpus: '2'}
          - {profile: '8', layout: split, outer_cpus: '2'}
          - {profile: rebuild-4, layout: split, outer_cpus: '2'}
          - {profile: rebuild-8, layout: split, outer_cpus: '2'}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: KVM access on this disposable GitHub-hosted runner only
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
      - name: Reject incomplete and incorrectly scoped resource evidence
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/vm -p test_runner.py
      - name: Measure lower CPU quota without changing freshness or payload requirements
        env:
          ROBOT_CPUS: ${{ inputs.robot_cpus }}
          CAPACITY_PROFILE: ${{ matrix.profile }}
          CPU_LAYOUT: ${{ matrix.layout }}
          VPNCTL_VM_RACE: '1'
          VPNCTL_VM_CPUS: ${{ matrix.outer_cpus }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-capacity-stress
        run: ./scripts/test-vm.sh --case "application-capacity-$CAPACITY_PROFILE" --robot-cpus "$ROBOT_CPUS" --cpu-layout "$CPU_LAYOUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-capacity-stress-${{ matrix.layout }}-${{ matrix.profile }}-${{ inputs.robot_cpus }}
          path: ${{ runner.temp }}/vpnctl-capacity-stress
          if-no-files-found: warn
          retention-days: 14
