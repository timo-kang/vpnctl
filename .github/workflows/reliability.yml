# Diagnostic branch only. Never merge this replacement of qualification CI.
name: Private maintenance duration attribution
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-maintenance-cost-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Verify fixed schedule and unchanged qualification validators
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Require disposable runner and create private output root
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -c /dev/kvm
          command -v gpg
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          install -d -m 700 "$RUNNER_TEMP/vpnctl-trace"
          printf 'VPNCTL_TRACE_ROOT=%s\n' "$RUNNER_TEMP/vpnctl-trace" >> "$GITHUB_ENV"
      - name: Run baseline diagnostic diagnostic baseline with original capacity gates
        timeout-minutes: 105
        run: python3 -B scripts/ci/maintenance_cost.py > "$VPNCTL_TRACE_ROOT/controller.log" 2>&1
      - name: Encrypt evidence for the private off-runner key
        id: seal
        if: always() && env.VPNCTL_TRACE_ROOT != ''
        run: python3 -B scripts/ci/seal_trace.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.seal.outcome == 'success'
        with:
          name: packet-trace-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/vpnctl-trace.tar.gpg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
