# Experiment branch only. Main/PR qualification remains unchanged; do not merge.
name: Identical image cross-host experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: identical-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Contract and isolation tests without Docker execution
        run: |
          python3 -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
          python3 -B -m unittest discover -s scripts/lab -p 'test_*.py' -v
          python3 -B -m unittest discover -s tests/vm -p 'test_*.py' -v
      - name: Freeze available CPU pair and private output root
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -c /dev/kvm
          command -v gpg
          export VPNCTL_IDENTICAL_ROOT="$RUNNER_TEMP/vpnctl-identical"
          install -d -m 700 "$VPNCTL_IDENTICAL_ROOT"
          printf 'VPNCTL_IDENTICAL_ROOT=%s\n' "$VPNCTL_IDENTICAL_ROOT" >> "$GITHUB_ENV"
          python3 -c 'import os; cpus=sorted(os.sched_getaffinity(0)); assert len(cpus)>=2; print("VPNCTL_IDENTICAL_CPUS="+",".join(map(str,cpus[:2])))' >> "$GITHUB_ENV"
      - name: Build once and execute all four fixed cells preserving failures
        timeout-minutes: 185
        run: |
          {
            python3 -B scripts/ci/identical_image.py prepare --root "$VPNCTL_IDENTICAL_ROOT" --cpuset "$VPNCTL_IDENTICAL_CPUS" &&
            python3 -B scripts/ci/identical_image.py run --root "$VPNCTL_IDENTICAL_ROOT" --cpuset "$VPNCTL_IDENTICAL_CPUS" --site ci
          } > "$VPNCTL_IDENTICAL_ROOT/controller.log" 2>&1
      - name: Encrypt pristine images and original evidence with the public recipient
        id: seal
        if: always() && env.VPNCTL_IDENTICAL_ROOT != ''
        run: python3 -B scripts/ci/seal_identical.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.seal.outcome == 'success'
        with:
          name: identical-image-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/vpnctl-identical.tar.gpg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
