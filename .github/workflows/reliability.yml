name: M1 reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m2-smoke:
    name: M2 persistent mixed producer ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: smoke
            duration: 12m
          - profile: production
            duration: 20m
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real producers across repeated faults (short validation, not 24h qualification)
        env:
          VPNCTL_SOAK_DURATION: ${{ matrix.duration }}
          VPNCTL_SOAK_PROFILE: ${{ matrix.profile }}
          VPNCTL_SOAK_NODES: '3'
          VPNCTL_SOAK_PHASE_INTERVAL: 30s
          VPNCTL_TEST_WORK_ROOT: ${{ runner.temp }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-results
        run: |
          status=0
          ./scripts/test-m2-soak.sh || status=$?
          mkdir -p "$VPNCTL_ARTIFACT_DIR"
          printf '%s\n' "$status" > "$VPNCTL_ARTIFACT_DIR/process-exit.txt"
          exit "$status"
      - name: Analyze artifacts and independently recorded process exit
        if: always()
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-results
        run: |
          go build -o "$RUNNER_TEMP/vpnctl-lab-report" ./cmd/vpnctl-lab-report
          shopt -s nullglob
          runs=("$VPNCTL_ARTIFACT_DIR"/m2-soak-*)
          manifests=("$VPNCTL_ARTIFACT_DIR"/run-*.txt)
          test "${#runs[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          "$RUNNER_TEMP/vpnctl-lab-report" --dir "${runs[0]}" \
            --manifest "${manifests[0]}" --exit-file "$VPNCTL_ARTIFACT_DIR/process-exit.txt" \
            > "$VPNCTL_ARTIFACT_DIR/analysis.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-mixed-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-m2-results
          if-no-files-found: warn
          retention-days: 14
  m2-pressure:
    name: M2 authenticated mixed WAL pressure and accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real backpressure, control requests, certificate renewal and exact fixture population
        env:
          VPNCTL_M2_PRESSURE: '1'
          VPNCTL_M2_PRESSURE_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-pressure
        run: go test -race ./internal/controller -run '^TestM2MixedWALPressureAccounting$' -count=1 -timeout=5m -v
      - name: One-hour credentials, real sync interval, CA rotation and rollback
        env:
          VPNCTL_PKI_LONG_PROFILE: '1'
        run: go test -race ./internal/controller -run '^TestPKILongLivedAutomaticCARotation$' -count=1 -timeout=8m -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-mixed-pressure
          path: ${{ runner.temp }}/vpnctl-m2-pressure
          if-no-files-found: warn
          retention-days: 14
  go:
    name: Go race, vet and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Churn, the full 128MiB WG payload check, and real full-mesh producers
      # run on dedicated jobs below. The payload check repeatedly decodes the
      # full real byte budget under race instrumentation; sharing history's
      # cumulative 10m test timer can terminate it despite forward progress.
      # Concurrent SQLite race packages on two CPUs can starve live producers
      # past their unchanged 45s convergence budget. Every test still runs.
      - run: go test -race ./... -skip '^TestPathChurn|^TestMonitorAndDirectRealProducersVariableScale$|^TestWireGuardByteBudgetReclaimsRealPayloadAndDetectsCorruption$'
      - run: go test -race -tags=integration ./tests/integration -run '^TestSoak(Readiness|PeerDiagnostic)' -count=1
      - run: go vet ./...
      - run: go build ./cmd/vpnctl
      - run: go build ./cmd/vpnctl-lab-report

  wireguard-storage:
    name: WireGuard real byte budget and corruption race
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Exact 128MiB retention, eviction, reopen and backup corruption checks
        run: go test -race ./internal/history -run '^TestWireGuardByteBudgetReclaimsRealPayloadAndDetectsCorruption$' -count=1 -timeout=5m -v

  relay-catalog:
    name: M3 relay catalog and node cache contention
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: 1/3/8/32 authenticated nodes, 4 relays, 8 candidates per node
        env:
          VPNCTL_RELAY_CATALOG_SCALE: '1'
        run: go test -race ./internal/controller -run '^TestRelayCatalogVariableScale$' -count=1 -timeout=5m -v
      - name: Concurrent initial path preparation, cache reopen and controller restore
        env:
          VPNCTL_RELAY_CACHE_SCALE: '1'
        run: go test -race ./internal/controller -run '^TestRelayCacheVariableScale$' -count=1 -timeout=5m -v

  history-churn:
    name: History path churn race and fault recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/history ./internal/controller -run '^TestPathChurn' -count=1 -timeout 10m -v

  wireguard:
    name: Kernel WireGuard and PKI lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Isolated namespaces, real processes, variable fleet and fault injection
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-network-results
          VPNCTL_RACE: '0'
        run: ./scripts/test-netns.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wireguard-measurements
          path: ${{ runner.temp }}/vpnctl-network-results
          if-no-files-found: warn
          retention-days: 14

  history-tiering:
    name: Full mesh tiered history capacity candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Two sources, four uplink generations and seven days of full mesh history
        env:
          VPNCTL_HISTORY_TIERED_SCALE: '1'
        run: go test ./internal/history -run '^TestTieredHistoryCandidate$' -count=1 -v
      - name: Corrupt and adversarial aggregate encodings
        run: go test ./internal/history -run '^$' -fuzz '^FuzzProbeAggregateDecode$' -fuzztime=10s -parallel=2
      - name: Variable mesh, 24 path generations, exact retained and discarded population
        env:
          VPNCTL_HISTORY_CHURN_SCALE: '1'
        run: go test ./internal/history -run '^TestPathChurnVariableMesh$' -count=1 -timeout 5m -v
      - name: Actual direct and monitor producers over mTLS (race, 1/3/8/32 nodes)
        run: go test -race ./internal/controller -run '^TestMonitorAndDirectRealProducersVariableScale$' -count=1 -timeout 5m -v

  history-transition:
    name: Production raw to tiered history transition
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # This job checks population, file/WAL size and query bounds while
      # compressing seven days into minutes. Keep FULL synchronous mode and
      # real files, but remove hosted-disk fsync latency from that experiment.
      # The go job still runs crash/reopen and smaller transitions on disk.
      - name: Allocate bounded memory filesystem for accelerated capacity test
        run: |
          mkdir -p "$RUNNER_TEMP/vpnctl-history"
          sudo mount -t tmpfs -o size=2G,nodev,nosuid,mode=1777 tmpfs "$RUNNER_TEMP/vpnctl-history"
      - name: Twenty million raw observations, atomic compaction and paginated query
        env:
          VPNCTL_HISTORY_TRANSITION_SCALE: '1'
          TMPDIR: ${{ runner.temp }}/vpnctl-history
        run: /usr/bin/time -v go test ./internal/history -run '^TestTieredStorageTransitionScale$' -count=1 -timeout 30m -v
      # The legacy 3.87M-probe / 322K-uplink fixture also compresses seven days
      # into minutes. Keep its 8s query / 60s cleanup budgets on the same bounded
      # filesystem. Ordinary race/crash tests above still use the runner disk.
      - name: Legacy 32-node seven-day query, WAL pressure and retention budget
        env:
          VPNCTL_HISTORY_SCALE: '1'
          TMPDIR: ${{ runner.temp }}/vpnctl-history
        run: /usr/bin/time -v go test ./internal/history -run '^TestHistoryScale$' -count=1 -timeout 5m -v
      - name: Release capacity test filesystem
        if: always()
        run: |
          if mountpoint -q "$RUNNER_TEMP/vpnctl-history"; then
            sudo umount "$RUNNER_TEMP/vpnctl-history"
          fi
