name: M2 recovery baseline investigation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  m2-smoke:
    name: M2 persistent mixed producer ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            duration: 20m
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real producers across repeated faults (short validation, not 24h qualification)
        env:
          VPNCTL_SOAK_DURATION: ${{ matrix.duration }}
          VPNCTL_SOAK_PROFILE: ${{ matrix.profile }}
          VPNCTL_SOAK_NODES: '3'
          VPNCTL_SOAK_PHASE_INTERVAL: 30s
          VPNCTL_TEST_WORK_ROOT: ${{ runner.temp }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-results
        run: |
          status=0
          ./scripts/test-m2-soak.sh || status=$?
          mkdir -p "$VPNCTL_ARTIFACT_DIR"
          printf '%s\n' "$status" > "$VPNCTL_ARTIFACT_DIR/process-exit.txt"
          exit "$status"
      - name: Analyze artifacts and independently recorded process exit
        if: always()
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-results
        run: |
          go build -o "$RUNNER_TEMP/vpnctl-lab-report" ./cmd/vpnctl-lab-report
          shopt -s nullglob
          runs=("$VPNCTL_ARTIFACT_DIR"/m2-soak-*)
          manifests=("$VPNCTL_ARTIFACT_DIR"/run-*.txt)
          test "${#runs[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          "$RUNNER_TEMP/vpnctl-lab-report" --dir "${runs[0]}" \
            --manifest "${manifests[0]}" --exit-file "$VPNCTL_ARTIFACT_DIR/process-exit.txt" \
            > "$VPNCTL_ARTIFACT_DIR/analysis.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-mixed-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-m2-results
          if-no-files-found: warn
          retention-days: 14
