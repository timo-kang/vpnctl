# Experiment-only branch; the default branch reliability pipeline is unchanged.
name: PR236 matched capacity investigation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr236-matched-${{ github.ref }}
  cancel-in-progress: false
jobs:
  matched:
    name: Same runner, fixed image, four A/B pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Prepare private evidence and disposable runner KVM access
        run: |
          export VPNCTL_MATCHED_ROOT="$RUNNER_TEMP/vpnctl-matched"
          printf 'VPNCTL_MATCHED_ROOT=%s\n' "$VPNCTL_MATCHED_ROOT" >> "$GITHUB_ENV"
          install -d -m 700 "$VPNCTL_MATCHED_ROOT"
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -c /dev/kvm
          if ! test -r /dev/kvm || ! test -w /dev/kvm; then
            sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          fi
          command -v gpg
      - name: Verify fixed schedule and failure retention
        run: python3 -B -m unittest discover -s scripts/ci -p test_matched_capacity.py
      - name: Execute complete fixed schedule; preserve every failure
        timeout-minutes: 300
        run: python3 scripts/ci/matched_capacity.py > "$VPNCTL_MATCHED_ROOT/controller.log" 2>&1
      - name: Encrypt evidence with off-runner private key
        id: seal
        if: always()
        run: bash scripts/ci/seal-evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.seal.outcome == 'success'
        with:
          name: pr236-matched-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/vpnctl-matched-evidence.tar.gpg
          if-no-files-found: error
          retention-days: 14
