name: M1 reliability

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m2-smoke:
    name: M2 persistent mixed producer ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: smoke
            duration: 12m
          - profile: production
            duration: 20m
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real producers across repeated faults (short validation, not 24h qualification)
        env:
          VPNCTL_SOAK_DURATION: ${{ matrix.duration }}
          VPNCTL_SOAK_PROFILE: ${{ matrix.profile }}
          VPNCTL_SOAK_NODES: '3'
          VPNCTL_SOAK_PHASE_INTERVAL: 30s
          VPNCTL_TEST_WORK_ROOT: ${{ runner.temp }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-results
        run: |
          status=0
          ./scripts/test-m2-soak.sh || status=$?
          mkdir -p "$VPNCTL_ARTIFACT_DIR"
          printf '%s\n' "$status" > "$VPNCTL_ARTIFACT_DIR/process-exit.txt"
          exit "$status"
      - name: Analyze artifacts and independently recorded process exit
        if: always()
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-results
        run: |
          go build -o "$RUNNER_TEMP/vpnctl-lab-report" ./cmd/vpnctl-lab-report
          shopt -s nullglob
          runs=("$VPNCTL_ARTIFACT_DIR"/m2-soak-*)
          manifests=("$VPNCTL_ARTIFACT_DIR"/run-*.txt)
          test "${#runs[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          "$RUNNER_TEMP/vpnctl-lab-report" --dir "${runs[0]}" \
            --manifest "${manifests[0]}" --exit-file "$VPNCTL_ARTIFACT_DIR/process-exit.txt" \
            > "$VPNCTL_ARTIFACT_DIR/analysis.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-mixed-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-m2-results
          if-no-files-found: warn
          retention-days: 14
  m2-pressure:
    name: M2 authenticated mixed WAL pressure and accounting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real backpressure, control requests, certificate renewal and exact fixture population
        env:
          VPNCTL_M2_PRESSURE: '1'
          VPNCTL_M2_PRESSURE_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m2-pressure
        run: go test -race ./internal/controller -run '^TestM2MixedWALPressureAccounting$' -count=1 -timeout=5m -v
      - name: One-hour credentials, real sync interval, CA rotation and rollback
        env:
          VPNCTL_PKI_LONG_PROFILE: '1'
        run: go test -race ./internal/controller -run '^TestPKILongLivedAutomaticCARotation$' -count=1 -timeout=8m -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-mixed-pressure
          path: ${{ runner.temp }}/vpnctl-m2-pressure
          if-no-files-found: warn
          retention-days: 14
  go:
    name: Go race, vet and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Churn, the full 128MiB WG payload check, and real full-mesh producers
      # run on dedicated jobs below. The payload check repeatedly decodes the
      # full real byte budget under race instrumentation; sharing history's
      # cumulative 10m test timer can terminate it despite forward progress.
      # Concurrent SQLite race packages on two CPUs can starve live producers
      # past their unchanged 45s convergence budget. Every test still runs.
      - run: go test -race ./... -skip '^TestPathChurn|^TestMonitorAndDirectRealProducersVariableScale$|^TestWireGuardByteBudgetReclaimsRealPayloadAndDetectsCorruption$'
      - run: go test -race -tags=integration ./tests/integration -run '^TestSoak(Readiness|PeerDiagnostic|DirectDiagnostics)|^TestCATransition' -count=1
      - name: VM runner isolation and evidence regressions (no guest power actions)
        run: python3 -m unittest discover -s tests/vm -p 'test_*.py' -v
      - run: go vet ./...
      - run: go build ./cmd/vpnctl
      - run: go build ./cmd/vpnctl-lab-report

  wireguard-storage:
    name: WireGuard real byte budget and corruption race
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Exact 128MiB retention, eviction, reopen and backup corruption checks
        run: go test -race ./internal/history -run '^TestWireGuardByteBudgetReclaimsRealPayloadAndDetectsCorruption$' -count=1 -timeout=5m -v

  relay-catalog:
    name: M3 relay catalog and node cache contention
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: 1/3/8/32 authenticated nodes, 4 relays, 8 candidates per node
        env:
          VPNCTL_RELAY_CATALOG_SCALE: '1'
        run: go test -race ./internal/controller -run '^TestRelayCatalogVariableScale$' -count=1 -timeout=5m -v
      - name: Concurrent initial path preparation, cache reopen and controller restore
        env:
          VPNCTL_RELAY_CACHE_SCALE: '1'
        run: go test -race ./internal/controller -run '^TestRelayCacheVariableScale$' -count=1 -timeout=5m -v

  history-churn:
    name: History path churn race and fault recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/history ./internal/controller -run '^TestPathChurn' -count=1 -timeout 10m -v

  wireguard:
    name: Kernel WireGuard and PKI lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Checkout the pinned pre-forwarding-policy version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0e1541845ca5086e358453b0c50c1dc300a6fb06
          path: .compat/relay-pre-policy
          persist-credentials: false
      - name: Build the actual prior binary for journal compatibility
        working-directory: .compat/relay-pre-policy
        run: go build -o "$RUNNER_TEMP/vpnctl-previous" ./cmd/vpnctl
      - name: Isolated namespaces, real processes, variable fleet and fault injection
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-network-results
          VPNCTL_RACE: '0'
          VPNCTL_TEST_PREVIOUS_BINARY: ${{ runner.temp }}/vpnctl-previous
        run: ./scripts/test-netns.sh -test.skip='^TestNetns_M3(AuthorityMatrix|LeaseConflicts|LeasePressure|SupervisionScale|ControlIsolation)$|^TestNetns_M3Node|^TestNetns_M3TargetApplication|^TestNetns_M3Preparation|^TestNetns_DirectDataplane$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: wireguard-measurements
          path: ${{ runner.temp }}/vpnctl-network-results
          if-no-files-found: warn
          retention-days: 14

  direct-dataplane:
    name: Direct WG verification and offline fallback ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production-32
            race: '0'
            sizes: '2,3,8,32'
          - profile: race-8
            race: '1'
            sizes: '2,3,8'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Actual packets, controller loss, broken WG with live UDP and service restart
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-direct-${{ matrix.profile }}
          VPNCTL_RACE: ${{ matrix.race }}
          VPNCTL_DIRECT_SIZES: ${{ matrix.sizes }}
          VPNCTL_TEST_CPUS: '2'
          VPNCTL_TEST_MEMORY: 2g
        run: ./scripts/test-netns.sh -test.run='^Test(Netns_DirectDataplane|DirectLossWatchRejectsOverlongOutage)$' -test.timeout=8m
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: direct-dataplane-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-direct-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 14

  m3-target-selection:
    name: M3 target observation and desired path (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            race: '0'
          - profile: race
            race: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Two relays, two underlays, controller outage, target faults and ownership
        env:
          VPNCTL_RACE: ${{ matrix.race }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-target-selection
        run: ./scripts/test-m3-target-selection.sh
      - name: Application target quarantine, transit preservation and crash recovery
        env:
          VPNCTL_RACE: ${{ matrix.race }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-target-selection
        run: ./scripts/test-m3-target-guard.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-target-selection-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-target-selection
          if-no-files-found: error
          retention-days: 14

  m3-node-lease:
    name: M3 node approval and kernel expiry (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            race: '0'
          - profile: race
            race: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Node leases, authority expiry, process faults and foreign state
        env:
          VPNCTL_RACE: ${{ matrix.race }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-node-lease
        run: ./scripts/test-m3-node-lease.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-node-lease-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-node-lease
          if-no-files-found: error
          retention-days: 14

  m3-target-application:
    name: M3 application target route transactions (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            race: '0'
            cpus: '2'
          - profile: race
            race: '1'
            cpus: '2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Unbound apps, failover, quarantine, interrupted commits and approval faults
        env:
          VPNCTL_RACE: ${{ matrix.race }}
          VPNCTL_TEST_CPUS: ${{ matrix.cpus }}
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-target-application
        run: ./scripts/test-m3-target-application.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-target-application-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-target-application
          if-no-files-found: error
          retention-days: 14

  m3-preparation:
    name: M3 owned candidate rebuilding (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: production
            race: '0'
          - profile: race
            race: '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Durable consent, real underlay changes, SIGKILL and eight-candidate mixed apps
        env:
          VPNCTL_RACE: ${{ matrix.race }}
          VPNCTL_TEST_CPUS: '2'
          VPNCTL_TEST_MEMORY: 2g
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-preparation
        run: ./scripts/test-m3-preparation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-preparation-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-preparation
          if-no-files-found: error
          retention-days: 14

  m3-control-isolation:
    name: M3 separate and colocated controller faults
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real mTLS, two relays, two underlays and offline expiry
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-control-isolation
        run: ./scripts/test-m3-control-isolation.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-control-isolation
          path: ${{ runner.temp }}/vpnctl-control-isolation
          if-no-files-found: error
          retention-days: 14

  m3-lease-matrix:
    name: M3 authenticated lease matrix and bounded overload
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Four paths, authority transitions, conflicts and bounded overload
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m3-lease-results
          VPNCTL_RACE: '0'
          VPNCTL_TEST_CPUS: '2'
          VPNCTL_TEST_MEMORY: 2g
        run: ./scripts/test-netns.sh -test.run='^TestNetns_M3(AuthorityMatrix|LeaseConflicts|LeasePressure)$' -test.timeout=12m
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-lease-matrix
          path: ${{ runner.temp }}/vpnctl-m3-lease-results
          if-no-files-found: error
          retention-days: 14

  # The fault matrix used 525s of a shared 720s test timer before scale tests
  # began, interrupting the final 32-node/8-endpoint case. Give population and
  # injected-delay profiles their own process budgets. Neither profile may
  # cancel or skip the other, and all product/individual test deadlines stay put.
  m3-supervision-scale:
    name: M3 supervisor scale ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: population
            pattern: '^TestNetns_M3SupervisionScale$'
            test_timeout: 8m
            delay_ms: 0
          - profile: kernel-delay
            pattern: '^TestNetns_M3SupervisionScale$/^nodes_32_endpoints_8$'
            test_timeout: 4m
            delay_ms: 5
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Real supervisor population and kernel command delay
        env:
          VPNCTL_ARTIFACT_DIR: ${{ runner.temp }}/vpnctl-m3-supervision-${{ matrix.profile }}
          VPNCTL_RACE: '0'
          VPNCTL_TEST_CPUS: '2'
          VPNCTL_TEST_MEMORY: 2g
        run: ./scripts/test-netns.sh -test.run='${{ matrix.pattern }}' -m3-scale-command-delay-ms=${{ matrix.delay_ms }} -test.timeout=${{ matrix.test_timeout }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m3-supervision-${{ matrix.profile }}
          path: ${{ runner.temp }}/vpnctl-m3-supervision-${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 14

  history-tiering:
    name: Full mesh tiered history capacity candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Two sources, four uplink generations and seven days of full mesh history
        env:
          VPNCTL_HISTORY_TIERED_SCALE: '1'
        run: go test ./internal/history -run '^TestTieredHistoryCandidate$' -count=1 -v
      - name: Corrupt and adversarial aggregate encodings
        run: go test ./internal/history -run '^$' -fuzz '^FuzzProbeAggregateDecode$' -fuzztime=10s -parallel=2
      - name: Variable mesh, 24 path generations, exact retained and discarded population
        env:
          VPNCTL_HISTORY_CHURN_SCALE: '1'
        run: go test ./internal/history -run '^TestPathChurnVariableMesh$' -count=1 -timeout 5m -v
      - name: Actual direct and monitor producers over mTLS (race, 1/3/8/32 nodes)
        run: go test -race ./internal/controller -run '^TestMonitorAndDirectRealProducersVariableScale$' -count=1 -timeout 5m -v

  history-transition:
    name: Production raw to tiered history transition
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # This job checks population, file/WAL size and query bounds while
      # compressing seven days into minutes. Keep FULL synchronous mode and
      # real files, but remove hosted-disk fsync latency from that experiment.
      # The go job still runs crash/reopen and smaller transitions on disk.
      - name: Allocate bounded memory filesystem for accelerated capacity test
        run: |
          mkdir -p "$RUNNER_TEMP/vpnctl-history"
          sudo mount -t tmpfs -o size=2G,nodev,nosuid,mode=1777 tmpfs "$RUNNER_TEMP/vpnctl-history"
      - name: Twenty million raw observations, atomic compaction and paginated query
        env:
          VPNCTL_HISTORY_TRANSITION_SCALE: '1'
          TMPDIR: ${{ runner.temp }}/vpnctl-history
        run: /usr/bin/time -v go test ./internal/history -run '^TestTieredStorageTransitionScale$' -count=1 -timeout 30m -v
      # The legacy 3.87M-probe / 322K-uplink fixture also compresses seven days
      # into minutes. Keep its 8s query / 60s cleanup budgets on the same bounded
      # filesystem. Ordinary race/crash tests above still use the runner disk.
      - name: Legacy 32-node seven-day query, WAL pressure and retention budget
        env:
          VPNCTL_HISTORY_SCALE: '1'
          TMPDIR: ${{ runner.temp }}/vpnctl-history
        run: /usr/bin/time -v go test ./internal/history -run '^TestHistoryScale$' -count=1 -timeout 5m -v
      - name: Release capacity test filesystem
        if: always()
        run: |
          if mountpoint -q "$RUNNER_TEMP/vpnctl-history"; then
            sudo umount "$RUNNER_TEMP/vpnctl-history"
          fi
