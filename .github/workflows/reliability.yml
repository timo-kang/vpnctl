# Experiment-only branch; the main reliability gates are unchanged.
name: Uplink app failure evidence validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uplink-handoff-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validation:
    name: Fixed source and guest image, 4/8-path app evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GOMAXPROCS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: Require a fresh disposable runner and private evidence
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_RUN_ATTEMPT" = 1
          test -c /dev/kvm
          command -v getfacl
          command -v setfacl
          command -v gpg
          export VPNCTL_MATCHED_ROOT="$RUNNER_TEMP/vpnctl-uplink-validation"
          install -d -m 700 "$VPNCTL_MATCHED_ROOT"
          printf 'VPNCTL_MATCHED_ROOT=%s\n' "$VPNCTL_MATCHED_ROOT" >> "$GITHUB_ENV"
      - name: Verify fixed schedule, failure retention, and resource boundaries
        run: python3 -B -m unittest discover -s scripts/ci -p test_uplink_handoff.py -v
      - name: Execute the fixed schedule and retain every failure
        timeout-minutes: 75
        run: python3 -B scripts/ci/uplink_handoff.py > "$VPNCTL_MATCHED_ROOT/controller.log" 2>&1
      - name: Encrypt evidence using the off-runner private key recipient
        id: seal
        if: always()
        run: bash scripts/ci/seal-evidence.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.seal.outcome == 'success'
        with:
          name: uplink-handoff-encrypted-${{ github.run_id }}
          path: ${{ runner.temp }}/vpnctl-matched-evidence.tar.gpg
          if-no-files-found: error
          retention-days: 14
